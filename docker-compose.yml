version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: eventease_db
    restart: always
    environment:
      POSTGRES_USER: eventease_user
      POSTGRES_PASSWORD: eventease_secure_password
      POSTGRES_DB: eventease_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventease_backend
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://eventease_user:eventease_secure_password@db:5432/eventease_db
      - SECRET_KEY=eventease-production-secret-key-supersecure-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.5-flash
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventease_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:

